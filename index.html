<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>영단어 퀴즈</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<div class="container">


    <!-- DAY 선택 화면 -->
    <section id="dayScreen">

        <h1>영단어 퀴즈</h1>

        <p class="description">
            시험 볼 DAY를 선택하세요.<br>
            여러 DAY를 동시에 선택할 수도 있습니다.
        </p>

        <div id="dayButtons"></div>

        <button id="startButton">
            START
        </button>

    </section>



    <!-- 퀴즈 화면 -->
    <section id="quizScreen" class="hidden">

        <div class="topInfo">

            <span id="progress">
                1 / 10
            </span>

        </div>


        <div class="wordBox">

            <div id="word">
                dormant
            </div>

        </div>


        <p class="questionText">
            해당하는 뜻을 모두 고르세요.
        </p>
        
        <p id="answerCount">
            정답 0개 · 선택 0 / 0
        </p>

        <div id="choices"></div>


        <button id="skipButton">
            정답 보기 · SKIP
        </button>

    </section>



    <!-- 결과 화면 -->
    <section id="resultScreen" class="hidden">

        <h1>시험 결과</h1>


        <!-- 완벽 -->
        <div class="resultCategory correctCategory">

            <h2>✓ 한 번에 맞힌 단어</h2>

            <div id="perfectWords"></div>

        </div>


        <!-- 오답 -->
        <div class="resultCategory wrongCategory">

            <h2>✕ 틀린 선택지를 고른 단어</h2>

            <div id="wrongWords"></div>

        </div>


        <!-- 스킵 -->
        <div class="resultCategory skippedCategory">

            <h2>→ 스킵된 단어</h2>

            <div id="skippedWords"></div>

        </div>


        <div class="resultButtons">

            <button id="retryButton">
                같은 단어 전체 다시 시험
            </button>

            <button id="wrongOnlyButton">
                틀린 / 스킵 단어만 다시 시험
            </button>

            <button id="changeDayButton">
                다른 DAY 선택
            </button>

        </div>

    </section>

</div>


<script src="script.js?v=3"></script>

</body>
</html>
